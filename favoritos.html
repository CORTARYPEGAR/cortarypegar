<script>
const FAVORITES_KEY="cortarPegarFavoritesV1";
const CART_KEY="cortarPegarCartV1";
const WA="56950375836";
const PRODUCTOS=window.CP_PRODUCTOS_LISTA||[];

function moneda(v){return "$"+Number(v).toLocaleString("es-CL")+" CLP";}
function monedaCorta(v){return "$"+Number(v).toLocaleString("es-CL");}
function escapar(t){return String(t??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function fechaBonita(f){return f?f.split("-").reverse().join("/"):"-";}
function precioTexto(p){if(p.tipo==="negocio"&&p.precioDesde)return "Desde "+moneda(p.precioDesde);return p.precio?moneda(p.precio):"Consultar precio";}
function categoriaTexto(p){return p.categoriaNombre||"Producto";}

function obtenerFavoritos(){try{const d=JSON.parse(localStorage.getItem(FAVORITES_KEY));return Array.isArray(d)?d:[]}catch{return []}}
function guardarFavoritos(f){localStorage.setItem(FAVORITES_KEY,JSON.stringify([...new Set(f)]));renderFavoritos();}

function renderFavoritos(){
  const ids=obtenerFavoritos();
  const productos=PRODUCTOS.filter(p=>ids.includes(p.id));
  document.getElementById("favoriteBadge").textContent=productos.length>99?"99+":productos.length;
  document.getElementById("favoriteCount").innerHTML=`<strong>${productos.length}</strong> ${productos.length===1?"producto guardado":"productos guardados"}`;
  const grid=document.getElementById("favoriteGrid");
  if(!productos.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1 / -1;"><span class="empty-heart">♡</span><h2>Todavía no tienes favoritos</h2><p>Guarda los productos que más te gusten tocando el corazón que aparece en cada tarjeta del catálogo.</p><a href="catalogo.html?categoria=todos">Ver catálogo →</a></div>`;
    return;
  }
  grid.innerHTML=productos.map(p=>{
    const foto=p.imagen?`<img class="photo" src="${p.imagen}" alt="${escapar(p.nombre)}" onerror="this.style.display='none'">`:"";
    return `<article class="card" data-page="${p.pagina}"><div class="visual"><span class="emoji">${p.emoji}</span>${foto}<button class="remove-favorite" type="button" data-remove-favorite="${p.id}" aria-label="Quitar de favoritos">♥</button></div><div class="info"><span class="category">${escapar(categoriaTexto(p))}</span><h2 class="name">${escapar(p.nombre)}</h2><p class="description">${escapar(p.descripcion)}</p><div class="price">${precioTexto(p)}</div><button class="view" type="button" data-page="${p.pagina}">Ver producto →</button></div></article>`;
  }).join("");
}

document.getElementById("favoriteGrid").addEventListener("click",e=>{
  const q=e.target.closest("[data-remove-favorite]");
  if(q){e.stopPropagation();guardarFavoritos(obtenerFavoritos().filter(id=>id!==q.dataset.removeFavorite));return;}
  const p=e.target.closest("[data-page]"); if(p)window.location.href=p.dataset.page;
});

/* CARRITO */
function obtenerCarrito(){try{const d=JSON.parse(localStorage.getItem(CART_KEY));return Array.isArray(d)?d:[]}catch{return []}}
function guardarCarrito(c){localStorage.setItem(CART_KEY,JSON.stringify(c));renderCarrito();}
function etiquetaDetalle(k){const m={"diseño":"Diseño","texto":"Texto","tematica":"Temática","preferencia":"Preferencia","figura":"Figura","tamano":"Tamaño","acabado":"Acabado","medida":"Medida","caras":"Caras","material":"Material","marca":"Marca","detalles":"Detalles","unidades":"Cantidad"};return m[k]||k.charAt(0).toUpperCase()+k.slice(1)}
function textoDetalles(item){const d=item.details||{};const a=Object.entries(d).filter(([,v])=>v!==""&&v!=="-"&&v!=null).map(([k,v])=>`${etiquetaDetalle(k)}: ${v}`);if(!a.length&&item.design)a.push(`Diseño: ${item.design}`);if(item.text&&item.text!=="-"&&!a.some(x=>x.startsWith("Texto:")))a.push(`Texto: ${item.text}`);return a.length?a.join(" · "):"Sin detalles adicionales";}
function cartCount(c){return c.reduce((t,i)=>t+(i.cartMode==="fixed-price"?1:(Number(i.qty)||1)),0)}
const overlay=document.getElementById("cartOverlay"),drawer=document.getElementById("cartDrawer");
function abrirCarrito(){overlay.classList.add("on");drawer.classList.add("on");document.body.classList.add("lock");renderCarrito();}
function cerrarCarrito(){overlay.classList.remove("on");drawer.classList.remove("on");document.body.classList.remove("lock");}
document.getElementById("cartOpen").onclick=abrirCarrito;document.getElementById("cartClose").onclick=cerrarCarrito;overlay.onclick=cerrarCarrito;

function renderCarrito(){
  const c=obtenerCarrito(),box=document.getElementById("cartItems");const count=cartCount(c);document.getElementById("cartBadge").textContent=count>99?"99+":count;
  if(!c.length){box.innerHTML='<div class="cart-empty">Tu carrito está vacío.</div>';document.getElementById("cartSubtotal").textContent="$0";document.getElementById("cartNote").textContent="";document.getElementById("cartCheckout").disabled=true;return;}
  document.getElementById("cartCheckout").disabled=false;let subtotal=0,cot=false;
  box.innerHTML=c.map(item=>{const qty=Number(item.qty)||1,precio=Number(item.price)||0,total=item.cartMode==="fixed-price"?precio:precio*qty;if(precio)subtotal+=total;else cot=true;const ctrl=item.cartMode==="fixed-price"?`<div class="cart-fixed">${escapar(item.fixedUnits?item.fixedUnits+" unidades":"Precio cerrado")}</div>`:`<div class="cart-qty"><button data-action="minus" type="button">−</button><span>${qty}</span><button data-action="plus" type="button">+</button></div>`;const fecha=item.date?`<br>Fecha: ${escapar(fechaBonita(item.date))}`:"";return `<div class="cart-item" data-cart-id="${escapar(item.id)}"><div class="cart-item-top"><div class="cart-item-name">${escapar(item.product||"Producto")}</div><button class="cart-remove" type="button" data-action="remove">×</button></div><div class="cart-details">${escapar(textoDetalles(item))}${fecha}</div><div class="cart-bottom">${ctrl}<div class="cart-price">${precio?moneda(total):"Por cotizar"}</div></div></div>`}).join("");
  document.getElementById("cartSubtotal").textContent=moneda(subtotal);document.getElementById("cartNote").textContent=cot?"El subtotal no incluye productos por cotizar.":"";
}

document.getElementById("cartItems").onclick=e=>{const b=e.target.closest("[data-action]");if(!b)return;const card=b.closest("[data-cart-id]");if(!card)return;const c=obtenerCarrito();const i=c.findIndex(x=>String(x.id)===card.dataset.cartId);if(i===-1)return;if(b.dataset.action==="remove")c.splice(i,1);else if(c[i].cartMode!=="fixed-price"){if(b.dataset.action==="plus")c[i].qty=Math.min(99,(Number(c[i].qty)||1)+1);if(b.dataset.action==="minus"){c[i].qty=(Number(c[i].qty)||1)-1;if(c[i].qty<=0)c.splice(i,1)}}guardarCarrito(c)};

document.getElementById("cartCheckout").onclick=()=>{const c=obtenerCarrito();if(!c.length)return;let subtotal=0,cot=false;const lines=c.map((item,i)=>{const qty=Number(item.qty)||1,precio=Number(item.price)||0,total=item.cartMode==="fixed-price"?precio:precio*qty;if(precio)subtotal+=total;else cot=true;const cantidad=item.cartMode==="fixed-price"?(item.fixedUnits+" unidades"):qty;const fecha=item.date?`\nFecha: ${fechaBonita(item.date)}`:"";return `${i+1}. ${item.product||"Producto"}\n${textoDetalles(item)}\nCantidad: ${cantidad} · ${precio?monedaCorta(total):"Por cotizar"}${fecha}`}).join("\n\n");const msg=`Hola Cortar y Pegar! Quiero hacer este pedido:\n\n${lines}\n\nSubtotal: ${moneda(subtotal)}${cot?"\nHay productos por cotizar.":""}`;window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,"_blank")};

const logo=document.getElementById("logoImage"),fb=document.getElementById("logoFallback");logo.addEventListener("error",()=>{logo.style.display="none";fb.style.display="block"});
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrarCarrito()});
renderFavoritos();renderCarrito();

</script>

</body>
